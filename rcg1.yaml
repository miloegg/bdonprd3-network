rcg1:
  rule_collection_group_name: "fw-rcg-group-1"
  rule_collection_group_priority: 1000

  application_rule_collection:
    - action: "Allow"
      name: "app-rule-1"
      priority: 300
      rule:
        - name: "rule-1"
          description: "Allow traffic to web servers"
          source_addresses:
            - "10.0.0.0/24"
          destination_fqdns:
            - "*.alpha.com"
          protocols:
            - type: "Http"
              port: 80

  network_rule_collection:
    - action: "Allow"
      name: "network-rule-1"
      priority: 200
      rule:
        - name: "network-rule-1"
          description: "Allow traffic from internal network"
          destination_addresses:
            - "30.0.0.0/24"
          destination_ports:
            - "443"
          protocols:
            - "TCP"
          source_addresses:
            - "10.0.0.0/24"
  timeouts:
    create: "30m"
    delete: "30m"
    read: "5m"
    update: "30m"